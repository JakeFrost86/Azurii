<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azurii Compatibility List</title>
<meta name="description" content="How well Nintendo 3DS games run on Azurii, the 3DS emulator for iPhone and iPad.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050b1f;
  --bg2: #0a1a3f;
  --panel: rgba(17, 33, 74, 0.72);
  --panel-solid: #0f2050;
  --line: rgba(120, 170, 255, 0.18);
  --text: #eaf2ff;
  --muted: #9db1d8;
  --accent: #39b6ff;
  --accent2: #7ce0ff;
  --s0: #2ee6a6; --s1: #6ad85b; --s2: #f2c94c; --s3: #f2994a;
  --s4: #eb5757; --s5: #b04a5a; --s99: #7d8aa8;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background: radial-gradient(1200px 700px at 80% -10%, #1a4fb0 0%, transparent 60%),
              radial-gradient(900px 600px at -10% 20%, #10307a 0%, transparent 55%),
              linear-gradient(180deg, var(--bg2), var(--bg) 60%);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .55;
  background-image:
    radial-gradient(1.2px 1.2px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 12%, #cfe6ff 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 38% 66%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 48%, #cfe6ff 50%, transparent 51%),
    radial-gradient(1.1px 1.1px at 55% 30%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 82%, #cfe6ff 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 93% 86%, #fff 50%, transparent 51%);
}
.wrap { position: relative; max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; }
header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
header img { width: 84px; height: auto; filter: drop-shadow(0 6px 22px rgba(57,182,255,.45)); }
.brand h1 { margin: 0; font-size: clamp(26px, 5vw, 40px); font-weight: 800; letter-spacing: -.02em; }
.brand h1 span { background: linear-gradient(90deg, var(--accent2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 620px; line-height: 1.45; }
.lang { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { background: transparent; color: var(--muted); border: 0; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
.lang button.on { background: var(--accent); color: #031026; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin: 26px 0 18px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(10px); cursor: pointer; transition: border-color .15s, transform .15s; }
.stat:hover { transform: translateY(-1px); border-color: rgba(124,224,255,.45); }
.stat.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.stat b { display: block; font-size: 22px; font-weight: 800; }
.stat span { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.search { flex: 1 1 260px; position: relative; }
.search input { width: 100%; padding: 12px 14px 12px 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-solid); color: var(--text); font: inherit; font-size: 15px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); opacity: .6; }
.toggle { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
.toggle.on { border-color: var(--accent); color: var(--accent2); }
.count { color: var(--muted); font-size: 13px; margin: 4px 2px 10px; }

.list { display: flex; flex-direction: column; gap: 8px; }
.game { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.game.tested { border-color: rgba(57,182,255,.42); background: linear-gradient(90deg, rgba(57,182,255,.12), var(--panel) 45%); }
.title { font-weight: 600; font-size: 15.5px; line-height: 1.3; overflow-wrap: anywhere; }
.ids { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; background: rgba(255,255,255,.06); border: 1px solid var(--line); grid-row: span 2; }
.note { grid-column: 1 / -1; margin-top: 6px; font-size: 13.5px; line-height: 1.45; color: #cfe0ff; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: #031026; background: var(--accent2); border-radius: 6px; padding: 2px 6px; margin-right: 6px; vertical-align: 1px; }
.was { color: var(--muted); font-size: 12.5px; }
.empty { text-align: center; color: var(--muted); padding: 50px 10px; }
footer { margin-top: 36px; color: var(--muted); font-size: 12.5px; line-height: 1.6; border-top: 1px solid var(--line); padding-top: 16px; }
footer a { color: var(--accent2); }
@media (max-width: 560px) {
  header img { width: 64px; }
  .lang { margin-left: 0; }
  .game { grid-template-columns: 1fr; }
  .badge { grid-row: auto; justify-self: start; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.png" alt="Azurii logo">
    <div class="brand">
      <h1><span>Azurii</span> <span data-t="h1"></span></h1>
      <p data-t="intro"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="it">IT</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <div class="tools">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off">
    </label>
    <button class="toggle" id="tested" type="button"></button>
  </div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>

  <footer>
    <p data-t="legend"></p>
    <p data-t="source"></p>
    <p data-t="disclaimer"></p>
  </footer>
</div>

<script>
const STATUS = [0, 1, 2, 3, 4, 5, 99];
const COLORS = { 0: "var(--s0)", 1: "var(--s1)", 2: "var(--s2)", 3: "var(--s3)", 4: "var(--s4)", 5: "var(--s5)", 99: "var(--s99)" };
const TEXT = {
  en: {
    h1: "Compatibility List",
    intro: "How well Nintendo 3DS games run on Azurii, the 3DS emulator for iPhone and iPad. Games tested on Azurii are highlighted; the others show the rating of the emulator it is based on.",
    search: "Search a game or a title ID…",
    tested: "Tested on Azurii only",
    all: "All",
    names: { 0: "Perfect", 1: "Great", 2: "Okay", 3: "Bad", 4: "Intro/Menu", 5: "Won't boot", 99: "Not tested" },
    count: (n, t) => `${n} of ${t} games`,
    tag: "Azurii",
    version: v => `tested on Azurii ${v}`,
    was: s => `Azahar rating: ${s}`,
    more: n => ` +${n} more`,
    empty: "No game matches the search.",
    legend: "Perfect: no known issues. Great: minor glitches. Okay: playable with noticeable issues. Bad: major issues, hard to play. Intro/Menu: only the intro or the menus. Won't boot: does not start.",
    source: 'Base data: the <a href="https://github.com/azahar-emu/compatibility-list" target="_blank" rel="noopener">Azahar compatibility list</a> (desktop and Android reports). Results on Azurii can be better or worse: the tested games replace those ratings.',
    disclaimer: "Azurii does not include games, keys or system files. Nintendo 3DS is a trademark of Nintendo, which is not affiliated with this project."
  },
  it: {
    h1: "Lista di compatibilità",
    intro: "Quanto bene girano i giochi Nintendo 3DS su Azurii, l'emulatore 3DS per iPhone e iPad. I giochi provati su Azurii sono evidenziati; gli altri mostrano la valutazione dell'emulatore da cui deriva.",
    search: "Cerca un gioco o un title ID…",
    tested: "Solo provati su Azurii",
    all: "Tutti",
    names: { 0: "Perfetto", 1: "Ottimo", 2: "Discreto", 3: "Scarso", 4: "Intro/Menu", 5: "Non si avvia", 99: "Non testato" },
    count: (n, t) => `${n} giochi su ${t}`,
    tag: "Azurii",
    version: v => `provato su Azurii ${v}`,
    was: s => `Valutazione Azahar: ${s}`,
    more: n => ` +${n} altri`,
    empty: "Nessun gioco corrisponde alla ricerca.",
    legend: "Perfetto: nessun problema noto. Ottimo: piccoli difetti. Discreto: giocabile con problemi evidenti. Scarso: problemi gravi, difficile da giocare. Intro/Menu: solo l'introduzione o i menu. Non si avvia: non parte.",
    source: 'Dati di base: la <a href="https://github.com/azahar-emu/compatibility-list" target="_blank" rel="noopener">lista di compatibilità di Azahar</a> (segnalazioni da computer e Android). Su Azurii i risultati possono essere migliori o peggiori: i giochi provati sostituiscono quelle valutazioni.',
    disclaimer: "Azurii non include giochi, chiavi o file di sistema. Nintendo 3DS è un marchio di Nintendo, che non ha legami con questo progetto."
  }
};

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let lang = store.get("azurii-compat-lang") || ((navigator.language || "en").toLowerCase().startsWith("it") ? "it" : "en");
let games = [];
const state = { q: "", status: null, tested: false };

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const statusOf = g => (g.s !== undefined ? g.s : g.a);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function applyText() {
  const T = TEXT[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = T[el.dataset.t]; });
  $("q").placeholder = T.search;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
}

function renderStats() {
  const T = TEXT[lang];
  const counts = {};
  STATUS.forEach(s => (counts[s] = 0));
  games.forEach(g => counts[statusOf(g)]++);
  const cell = (key, label, n, color) =>
    `<div class="stat${state.status === key ? " on" : ""}" data-s="${key === null ? "" : key}">` +
    `<b>${n}</b><span>${color ? `<i class="dot" style="background:${color}"></i>` : ""}${label}</span></div>`;
  $("stats").innerHTML = cell(null, T.all, games.length, "") +
    STATUS.map(s => cell(s, T.names[s], counts[s], COLORS[s])).join("");
  $("stats").querySelectorAll(".stat").forEach(el => el.addEventListener("click", () => {
    const s = el.dataset.s === "" ? null : Number(el.dataset.s);
    state.status = state.status === s ? null : s;
    render();
  }));
}

function render() {
  const T = TEXT[lang];
  renderStats();
  $("tested").classList.toggle("on", state.tested);
  $("tested").textContent = (state.tested ? "★ " : "☆ ") + T.tested;
  const q = norm(state.q.trim());
  const shown = games.filter(g =>
    (state.status === null || statusOf(g) === state.status) &&
    (!state.tested || g.s !== undefined) &&
    (!q || norm(g.t).includes(q) || g.ids.some(id => id.toLowerCase().includes(q))));
  $("count").textContent = T.count(shown.length, games.length);
  if (!shown.length) {
    $("list").innerHTML = `<div class="empty">${T.empty}</div>`;
    return;
  }
  $("list").innerHTML = shown.map(g => {
    const s = statusOf(g);
    const tested = g.s !== undefined;
    const ids = g.ids.slice(0, 2).join(" · ") + (g.ids.length > 2 ? T.more(g.ids.length - 2) : "");
    let note = "";
    if (tested) {
      note = `<div class="note"><span class="tag">${T.tag}</span>${esc(g[lang])} <span class="was">— ${T.version(esc(g.v))}` +
        (g.a !== g.s ? ` · ${T.was(T.names[g.a])}` : "") + `</span></div>`;
    }
    return `<article class="game${tested ? " tested" : ""}">` +
      `<div class="title">${esc(g.t)}</div>` +
      `<div class="badge"><i class="dot" style="background:${COLORS[s]}"></i>${T.names[s]}</div>` +
      `<div class="ids">${ids}</div>${note}</article>`;
  }).join("");
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  store.set("azurii-compat-lang", lang);
  applyText();
  render();
}));
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("tested").addEventListener("click", () => { state.tested = !state.tested; render(); });

applyText();
fetch("data.json")
  .then(r => r.json())
  .then(d => { games = d.games; render(); })
  .catch(() => { $("list").innerHTML = `<div class="empty">data.json?</div>`; });
</script>
</body>
</html>
